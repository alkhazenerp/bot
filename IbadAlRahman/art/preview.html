<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(../app/src/main/res/font/tajawal_bold.ttf)} @font-face{font-family:R;src:url(../app/src/main/res/font/aref_ruqaa_bold.ttf)}
body{margin:0;width:1100px;height:620px;background:linear-gradient(135deg,#041915,#0C4436 55%,#1F7A60);font-family:T;color:#fff;position:relative;overflow:hidden}
.icon{position:absolute;right:70px;top:90px;width:300px;height:300px;border-radius:70px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.title{position:absolute;right:60px;top:420px;width:320px;text-align:center;font-family:R;font-size:64px;color:#E8C468}
.sub{position:absolute;right:60px;top:510px;width:320px;text-align:center;font-size:20px;opacity:.85}
.phone{position:absolute;left:70px;top:60px;width:560px;border-radius:28px;background:#0b1220;box-shadow:0 30px 60px rgba(0,0,0,.45);overflow:hidden}
.sb{direction:ltr;display:flex;align-items:center;gap:10px;padding:14px 22px;background:#111827;font-family:Roboto,Arial;font-size:22px}
.ic{display:flex;flex-direction:column;align-items:center;line-height:1;width:36px}
.ic b{font-family:'Roboto Condensed',Arial Narrow,Arial;font-size:17px;letter-spacing:-.5px}.ic i{font-style:normal;font-family:T;font-size:12px}
.sp{flex:1}.bat{width:30px;height:14px;border:2px solid #fff;border-radius:4px;position:relative}.bat:after{content:'';position:absolute;left:2px;top:2px;width:18px;height:10px;background:#fff}
.card{margin:18px;border-radius:22px;background:#162433;padding:18px 20px}
.row{display:flex;align-items:center;justify-content:space-between}
.n{font-size:26px}.cd{direction:ltr;font-family:Arial;font-weight:bold;color:#C9A227;font-size:28px}
.grid{display:flex;margin-top:14px;gap:4px}.c{flex:1;text-align:center;padding:8px 0;border-radius:12px;color:#cbd5e1;font-size:15px}.c div{color:#fff;font-size:18px}
.c.h{background:rgba(201,162,39,.25);border:1px solid rgba(201,162,39,.6);color:#E8C468}.c.h div{color:#E8C468}
.lbl{font-size:15px;opacity:.7;margin:0 22px 18px}
</style></head><body>
<img class="icon" src="ic_launcher-playstore.png">
<div class="title">عباد الرحمن</div>
<div class="sub">العد التنازلي للصلاة بجانب الساعة</div>
<div class="phone">
 <div class="sb"><span>12:30</span><div class="ic"><b>2:45</b><i>عصر</i></div><span class="sp"></span><span style="font-size:16px">▂▄▆█</span><div class="bat"></div></div>
 <div class="card"><div class="row"><div><div class="n">العصر 3:15 م</div><div style="opacity:.7;font-size:16px">مكة المكرمة</div></div><div style="text-align:center"><div style="font-size:13px;opacity:.7">متبقي</div><div class="cd">2:44:12</div></div></div>
 <div class="grid"><div class="c">الفجر<div>5:12</div></div><div class="c">الشروق<div>6:31</div></div><div class="c">الظهر<div>12:21</div></div><div class="c h">العصر<div>3:15</div></div><div class="c">المغرب<div>6:02</div></div><div class="c">العشاء<div>7:32</div></div></div>
 <div style="text-align:center;margin-top:10px;font-size:14px;opacity:.7">27 ربيع الآخر 1448 هـ • الخميس، 8 أكتوبر 2026</div></div>
 <div class="lbl">↑ شكل الإشعار عند سحب شريط الحالة</div>
</div>
</body></html>
