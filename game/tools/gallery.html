<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>معرض النماذج</title>
<style>html,body{margin:0;background:#222;color:#eee;font-family:sans-serif}canvas{display:block}#l{position:fixed;top:8px;right:12px;font-size:20px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="l"></div>
<script type="module">
// معرض لفحص النماذج الإجرائية بصرياً: ?m=t72
import * as THREE from 'three';
import { createModel, towLauncherModel, kpvModel, fpvDroneModel, towMissileModel } from '../src/engine/models.js';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.8; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa6b8);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b5a44, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 3); sun.position.set(30, 50, 20); sun.castShadow = true; sun.shadow.camera.left = sun.shadow.camera.bottom = -20; sun.shadow.camera.right = sun.shadow.camera.top = 20; scene.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x8a7a5e })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
const name = new URLSearchParams(location.search).get('m') || 't72';
let obj, size = 8;
if (name === 'tow') { obj = towLauncherModel(); size = 2.5; }
else if (name === 'kpv') { obj = kpvModel(); size = 2.5; }
else if (name === 'fpv') { obj = fpvDroneModel(); size = 1; }
else if (name === 'missile') { obj = towMissileModel(); size = 1.6; }
else { const m = createModel(name); obj = m.root; size = Math.max(m.length, m.width, m.height) * 1.1; }
obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
const air = ['mi24','mi8','su24','su34','recon','kamikaze'].includes(name);
if (air) obj.position.y = size * 0.25;
scene.add(obj);
document.getElementById('l').textContent = name;
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 1000);
const a = parseFloat(new URLSearchParams(location.search).get('a') || '0.7');
cam.position.set(Math.sin(a) * size * 1.3, size * 0.55 + (air ? size * 0.25 : 0), Math.cos(a) * size * 1.3);
cam.lookAt(0, (air ? size * 0.25 : 0) + size * 0.12, 0);
r.render(scene, cam);
window.__done = true;
</script></body></html>
