<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد أكواد ردع العدوان</title>
<style>
  :root { --bg: #0b0e0b; --panel: #151a16; --line: rgba(226,216,188,.18); --fg: #e8dec3; --dim: #a8a189; --green: #2f8a4c; --brass: #e0a43a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; padding: 24px 16px; }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; color: var(--dim); font-size: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  input, select { height: 44px; background: #000; color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 0 10px; font: 15px ui-monospace, monospace; direction: ltr; }
  button { height: 46px; background: var(--green); color: #fff; border: 0; border-radius: 3px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .out { font: 30px ui-monospace, monospace; letter-spacing: .12em; text-align: center; padding: 16px; border: 1px dashed var(--brass); color: var(--brass); user-select: all; direction: ltr; }
  .msg { background: var(--panel); border: 1px solid var(--line); padding: 12px; white-space: pre-wrap; font-size: 14px; user-select: all; }
</style>
</head>
<body>
<main>
  <h1>مولّد أكواد التفعيل</h1>
  <p>للبائع فقط — لا تنشر هذه الصفحة. الصق المعرّف ورقم الطلب من رسالة واتساب، ثم أرسل الكود للمشتري.</p>
  <label>معرّف الجهاز (UUID)<input id="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label>
  <label>المنتج
    <select id="item">
      <option value="gold_5k">صندوق ذهب 5,000 (gold_5k)</option>
      <option value="gold_25k">خزنة ذهب 25,000 (gold_25k)</option>
      <option value="tow2b">تاو 2B (tow2b)</option>
      <option value="unlock_all">فتح كل المناطق (unlock_all)</option>
      <option value="vip">عضوية القائد (vip)</option>
      <option value="skin_gold">قاذف ذهبي (skin_gold)</option>
    </select>
  </label>
  <label>رقم الطلب<input id="order" type="number" min="1" value="1"></label>
  <label>المفتاح السري (shopSecret)<input id="secret" value="RADA-2024-12-08-TOW"></label>
  <button id="go">توليد الكود</button>
  <div class="out" id="out">—</div>
  <div class="msg" id="msg"></div>
</main>
<script type="module">
  import { makeCode } from '../src/core/codes.js';
  const $ = (id) => document.getElementById(id);
  // استخراج تلقائي عند لصق رسالة الطلب كاملة في حقل المعرّف
  $('uuid').addEventListener('input', () => {
    const v = $('uuid').value;
    const u = v.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    const it = v.match(/\((gold_5k|gold_25k|tow2b|unlock_all|vip|skin_gold)\)/);
    const o = v.match(/رقم الطلب:\s*(\d+)/);
    if (u && v.length > 40) { $('uuid').value = u[0]; if (it) $('item').value = it[1]; if (o) $('order').value = o[1]; }
  });
  $('go').onclick = () => {
    const code = makeCode($('uuid').value, $('item').value, parseInt($('order').value || '1', 10), $('secret').value);
    $('out').textContent = code;
    $('msg').textContent = `شكراً لشرائك من ردع العدوان 🎯\nكود التفعيل: ${code}\nافتح: المتجر ← مميز ← أدخل الكود ← تفعيل`;
  };
</script>
</body>
</html>
